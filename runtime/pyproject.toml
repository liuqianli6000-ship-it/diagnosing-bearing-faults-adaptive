[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing-diagnosis-suite-app"
version = "2.0.0"
description = "Explainable bearing diagnosis and signal analysis with optional adaptive processing."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.0,<3",
  "openai>=1.40",
  "langgraph>=1.2,<2",
  "PyWavelets>=1.4",
  "EMD-signal>=1.6",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
